# Every 6 h: restore state, harvest, decide licences, probe, build, publish to Pages.
name: directory

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: directory
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # No write token in git config while npm install scripts and feed
          # parsing run; only the commit step gets it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore previous state
        run: node src/restore-state.js "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Harvest, decide licences, probe, build
        run: npm run cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Scan for credentials (blocks commit and publish)
        run: node src/scan-secrets.js entries dist
      - name: Validate entries against the schema (blocks commit and publish)
        run: node src/validate-dist.js entries dist
      - name: Commit entry changes
        # A PR merged while this run worked moves main: rebase onto it and retry,
        # rather than losing the run to a non-fast-forward push.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add entries
          if ! git diff --cached --quiet; then
            git commit -m "directory: $(git diff --cached --name-only | wc -l) entries changed"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              echo "push attempt $attempt failed; retrying"
              sleep 15
            done
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Keep the schedule enabled
        # Also after a failed run: a streak of failures must not let GitHub disable the schedule.
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/directory.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
